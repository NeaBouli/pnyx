version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    labels: ["security"]

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    labels: ["security"]
    ignore:
      # These major lines are not yet validated with the current web toolchain.
      - dependency-name: "eslint"
        versions: ["10.x"]
      - dependency-name: "typescript"
        versions: ["7.x"]
      # Keep runtime types aligned with the Node 22 runtime in .nvmrc and CI.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
