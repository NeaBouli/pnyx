version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    labels: ["security"]

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    labels: ["security"]
    ignore:
      # The current Next.js lint stack does not yet support these major lines.
      - dependency-name: "eslint"
        versions: ["10.x"]
      - dependency-name: "typescript"
        versions: ["7.x"]
