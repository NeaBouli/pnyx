name: Security Audit

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Detection
    # GitHub-hosted only: security jobs rely on the hosted image toolchain.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    # GitHub-hosted only: uses the preinstalled npm/pip/cargo of the hosted image.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check for package.json
        id: check-npm
        run: |
          if [ -f package.json ]; then
            echo "has_npm=true" >> $GITHUB_OUTPUT
          else
            echo "has_npm=false" >> $GITHUB_OUTPUT
          fi

      - name: npm audit gate self-test
        run: node --test scripts/npm-audit-gate.check.mjs

      - name: npm audit (all workspaces)
        run: |
          failed=0
          while IFS= read -r lockfile; do
            dir="$(dirname "$lockfile")"
            echo "=== npm audit: $dir ==="
            # Gate: high/critical fail unless covered by an unexpired entry in
            # .github/npm-audit-allowlist.json for this workspace; entries expire on review_by.
            ws="${dir#./}"
            (cd "$dir" && { npm audit --json || true; } | node "$GITHUB_WORKSPACE/scripts/npm-audit-gate.mjs" "$ws") || failed=1
          done < <(find . -maxdepth 3 -name package-lock.json -not -path "*/node_modules/*" | sort)
          exit $failed

      - name: cargo audit (informational — no Rust workspace in pnyx)
        run: |
          # Soft-fail: pnyx has no Rust code. Cargo audit runs only if Cargo.toml found.
          if find . -maxdepth 3 -name "Cargo.toml" -print -quit | grep -q .; then
            cargo install cargo-audit 2>/dev/null || true
            cargo audit || echo "::warning::cargo audit found issues (informational)"
          else
            echo "No Cargo.toml found — skipping"
          fi

      - name: pip audit (all requirements.txt)
        run: |
          pip install pip-audit
          failed=0
          while IFS= read -r req; do
            echo "=== pip-audit: $req ==="
            # arweave-python-client 1.0.19 hard-depends on python-jose/ecdsa,
            # while this project uses only its RSA Arweave wallet path. Upstream
            # has no fixed release yet; keep these scoped exceptions visible.
            # CVE-2026-85394 (GHSA-3qf3-8w2g-rqmx, python-jose <=3.5.0, no fix):
            # HMAC key validation; jose is used only for base64url helpers and
            # RS256 JWK construction of our own wallet, never HMAC. Added
            # 2026-10-08 (T-604, Q11 decision); review_by 2026-11-01.
            pip-audit --ignore-vuln PYSEC-2026-1325 --ignore-vuln CVE-2026-85394 -r "$req" || failed=1
          done < <(find . -maxdepth 3 -name "requirements.txt" -print | sort)
          exit $failed

  security-summary:
    name: Security Summary
    # GitHub-hosted only (summary of the security jobs).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [secret-scan, dependency-audit]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
