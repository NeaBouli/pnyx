name: CI — Ekklesia.gr
# Copyright (c) 2026 Vendetta Labs — MIT License

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-api:
    name: Python API Tests
    # GitHub-hosted only: needs the redis service container (no Docker for pnyx on the fallback host).
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redis:
        # Docker Official Image, Redis 8.10.2-alpine; digest matches Docker Hub.
        image: public.ecr.aws/docker/library/redis@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install system dependencies (for PyNaCl)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libsodium-dev

      - name: Install Python dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        working-directory: apps/api
        env:
          SERVER_SALT: ci-test-salt-not-production
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          REDIS_URL: redis://localhost:6379
          ENVIRONMENT: development
        run: |
          python -m pytest tests/ -v --tb=short

  test-crypto:
    name: Crypto Package Tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    # Fallback runner (CI_RUNNER) only for push/dispatch or same-repo PRs; see docs/CI.md.
    if: ${{ !vars.CI_RUNNER || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install system dependencies (for PyNaCl)
        # No sudo on the fallback runner; the PyNaCl wheel bundles libsodium.
        if: ${{ !vars.CI_RUNNER }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libsodium-dev

      - name: Install crypto dependencies
        run: |
          pip install PyNaCl pytest pytest-asyncio httpx

      - name: Run crypto tests
        working-directory: packages/crypto
        env:
          SERVER_SALT: ci-test-salt-not-production
        run: |
          python -m pytest tests/ -v --tb=short

  test-docs-redesign:
    name: Docs Redesign Gates
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    # Fallback runner (CI_RUNNER) only for push/dispatch or same-repo PRs; see docs/CI.md.
    if: ${{ !vars.CI_RUNNER || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Standard-library-only unittest gates for the static docs (R0 inventory,
      # approved audit delta, R2 landing / R3 wiki checks, FAQ/wiki regressions).
      - name: Run redesign gates
        working-directory: scripts/redesign
        run: |
          python -m unittest discover -p 'test_*.py' -v

  test-clients:
    name: Client ${{ matrix.name }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    # Fallback runner (CI_RUNNER) only for push/dispatch or same-repo PRs; see docs/CI.md.
    if: ${{ !vars.CI_RUNNER || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 30
    env:
      # The root .npmrc (ignore-scripts=true) is not read inside apps/*; enforce it here.
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web
            path: apps/web
            verify: node --test ../../scripts/client-yaml-security.check.cjs image-codec.check.mjs ../../scripts/static-docs-remote-sinks.check.mjs ../../scripts/public-seo.check.mjs && npm run lint && npm run typecheck && npm test && npm run build
          - name: Dashboard
            path: apps/dashboard
            verify: node --test ../../scripts/client-yaml-security.check.cjs image-codec.check.mjs health-shapes.test.mjs && npm run lint && npm run typecheck && npm run build
          - name: Mobile
            path: apps/mobile
            verify: node --test ../../scripts/client-yaml-security.check.cjs && npx --no-install expo install --check && npm run typecheck && npm test
          - name: Representative
            path: apps/representative
            verify: node --test ../../scripts/client-yaml-security.check.cjs && npx --no-install expo install --check && npm run typecheck && npm test
          - name: Crypto-TS
            path: packages/crypto
            verify: npm run typecheck && npm test

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Verify ${{ matrix.name }}
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.verify }}

  fallback-fork-guard:
    name: Fallback Fork Guard
    # GitHub-hosted only. While CI_RUNNER (fallback) is set, the fallback-capable jobs skip
    # fork PRs; a skipped job must not read as green, so this job fails those PRs explicitly.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.CI_RUNNER && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Fork PRs are not mergeable while the CI fallback is active
        run: |
          echo "::error::CI fallback (CI_RUNNER) is active: crypto/docs/client gates did not run for this fork PR. Not mergeable until CI_RUNNER is unset and CI is re-run."
          exit 1
