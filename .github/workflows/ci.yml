name: CI — Ekklesia.gr
# Copyright (c) 2026 Vendetta Labs — MIT License

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-api:
    name: Python API Tests
    # GitHub-hosted only: starts Redis/PostgreSQL containers (no Docker for pnyx on the fallback host).
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Redis 8.10.2-alpine (Docker Official Image), digest-pinned. Started as a
      # step instead of a service container so the pull can fall back across
      # registries: ECR Public hit its anonymous data limit on shared runner
      # IPs, and mirror.gcr.io is an evictable cache. The digest pin makes every
      # source byte-identical.
      - name: Start redis (digest-pinned, registry fallback)
        run: |
          set -euo pipefail
          DIGEST="sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0"
          IMG=""
          for ref in mirror.gcr.io/library/redis public.ecr.aws/docker/library/redis docker.io/library/redis; do
            for attempt in 1 2; do
              if docker pull -q "$ref@$DIGEST"; then IMG="$ref@$DIGEST"; break 2; fi
              sleep 5
            done
          done
          test -n "$IMG" || { echo "redis image unavailable from all registries"; exit 1; }
          docker run -d --name redis -p 6379:6379 "$IMG"
          for i in $(seq 1 30); do
            if docker exec redis redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 1
          done
          echo "redis did not become healthy"; exit 1

      # PostgreSQL 15.18-alpine (Docker Official Image), with the same digest-pinned
      # registry fallback and retries as Redis above.
      - name: Start PostgreSQL (digest-pinned, registry fallback)
        run: |
          set -euo pipefail
          DIGEST="sha256:df7bca0066e6f60cc3dd32faa70caddec20e2c22b58932f79498e5704b23854a"
          IMG=""
          for ref in mirror.gcr.io/library/postgres public.ecr.aws/docker/library/postgres docker.io/library/postgres; do
            for attempt in 1 2; do
              if docker pull -q "$ref@$DIGEST"; then IMG="$ref@$DIGEST"; break 2; fi
              sleep 5
            done
          done
          test -n "$IMG" || { echo "postgres image unavailable from all registries"; exit 1; }
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          export POSTGRES_PASSWORD
          docker run -d --name postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD -e POSTGRES_DB=pnyx_test_ci "$IMG"
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -h 127.0.0.1 -U test -d pnyx_test_ci; then
              echo "PNYX_TEST_POSTGRES_URL=postgresql+asyncpg://test:$POSTGRES_PASSWORD@127.0.0.1:5432/pnyx_test_ci" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become healthy"; exit 1

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install system dependencies (for PyNaCl; age for the backup test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libsodium-dev age

      # ADR-007 S3: off-site backups are age-encrypted before upload (fails if age is missing).
      - name: Backup encryption test
        env:
          BACKUP_TEST_REQUIRE_AGE: "1"
        run: python -m unittest scripts/tests/test_backup_encryption.py -v

      - name: Install Python dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        working-directory: apps/api
        env:
          SERVER_SALT: ci-test-salt-not-production
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          REDIS_URL: redis://localhost:6379
          ENVIRONMENT: development
        run: |
          set -euo pipefail
          python -m pytest tests/ -v --tb=short -rs | tee "$RUNNER_TEMP/api-tests.log"
          if grep -E '^SKIPPED .*(_pg\.py|test_knowledge_base_sync\.py|test_municipal_vote_concurrency\.py|PNYX_TEST_POSTGRES_URL)' "$RUNNER_TEMP/api-tests.log"; then
            echo "::error::Real PostgreSQL tests must run without skips"
            exit 1
          fi

  test-crypto:
    name: Crypto Package Tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    # Fallback runner (CI_RUNNER) only for push/dispatch or same-repo PRs; see docs/CI.md.
    if: ${{ !vars.CI_RUNNER || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install system dependencies (for PyNaCl)
        # No sudo on the fallback runner; the PyNaCl wheel bundles libsodium.
        if: ${{ !vars.CI_RUNNER }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libsodium-dev

      - name: Install crypto dependencies
        run: |
          pip install PyNaCl pytest pytest-asyncio httpx

      - name: Run crypto tests
        working-directory: packages/crypto
        env:
          SERVER_SALT: ci-test-salt-not-production
        run: |
          python -m pytest tests/ -v --tb=short

  test-docs-redesign:
    name: Docs Redesign Gates
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    # Fallback runner (CI_RUNNER) only for push/dispatch or same-repo PRs; see docs/CI.md.
    if: ${{ !vars.CI_RUNNER || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Standard-library-only unittest gates for the static docs (R0 inventory,
      # approved audit delta, R2 landing / R3 wiki checks, FAQ/wiki regressions).
      - name: Run redesign gates
        working-directory: scripts/redesign
        run: |
          python -m unittest discover -p 'test_*.py' -v

      - name: Run Node documentation gates
        run: node --test scripts/public-seo.check.mjs scripts/static-docs-remote-sinks.check.mjs scripts/redesign/community_payment_status.check.mjs

  test-clients:
    name: Client ${{ matrix.name }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    # Fallback runner (CI_RUNNER) only for push/dispatch or same-repo PRs; see docs/CI.md.
    if: ${{ !vars.CI_RUNNER || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 30
    env:
      # The root .npmrc (ignore-scripts=true) is not read inside apps/*; enforce it here.
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web
            path: apps/web
            verify: node --test ../../scripts/client-yaml-security.check.cjs image-codec.check.mjs ../../scripts/static-docs-remote-sinks.check.mjs ../../scripts/public-seo.check.mjs && npm run lint && npm run typecheck && npm test && npm run build
          - name: Dashboard
            path: apps/dashboard
            verify: node --test ../../scripts/client-yaml-security.check.cjs image-codec.check.mjs health-shapes.test.mjs overview.test.mjs && npm run lint && npm run typecheck && npm run build
          - name: Mobile
            path: apps/mobile
            verify: node --test ../../scripts/client-yaml-security.check.cjs && npx --no-install expo install --check && npm run typecheck && npm test
          - name: Representative
            path: apps/representative
            verify: node --test ../../scripts/client-yaml-security.check.cjs && npx --no-install expo install --check && npm run typecheck && npm test
          - name: Crypto-TS
            path: packages/crypto
            verify: npm run typecheck && npm test

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Verify ${{ matrix.name }}
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.verify }}

  fallback-fork-guard:
    name: Fallback Fork Guard
    # GitHub-hosted only. While CI_RUNNER (fallback) is set, the fallback-capable jobs skip
    # fork PRs; a skipped job must not read as green, so this job fails those PRs explicitly.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.CI_RUNNER && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Fork PRs are not mergeable while the CI fallback is active
        run: |
          echo "::error::CI fallback (CI_RUNNER) is active: crypto/docs/client gates did not run for this fork PR. Not mergeable until CI_RUNNER is unset and CI is re-run."
          exit 1
